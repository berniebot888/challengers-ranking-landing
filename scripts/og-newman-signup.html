<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OG Newman Signup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 0; }
  .og {
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #57232d 0%, #3d161d 100%);
    color: #FAF7F2;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 60px 80px;
    box-sizing: border-box;
    gap: 60px;
  }
  /* Decorative bg circles (dorado + granate tone) */
  .og::before {
    content: '';
    position: absolute;
    top: -250px; right: -250px;
    width: 600px; height: 600px;
    background: rgba(226, 166, 21, 0.12);
    border-radius: 50%;
  }
  .og::after {
    content: '';
    position: absolute;
    bottom: -200px; left: -200px;
    width: 500px; height: 500px;
    background: rgba(0, 0, 0, 0.18);
    border-radius: 50%;
  }
  /* Left: Newman logo + brand mark */
  .logo-wrap {
    position: relative;
    z-index: 1;
    width: 320px; height: 320px;
    border-radius: 50%;
    background: rgba(250, 247, 242, 0.06);
    border: 4px solid rgba(226, 166, 21, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
  }
  .logo-wrap img {
    width: 280px; height: 280px;
    border-radius: 50%;
    object-fit: cover;
  }
  /* Right: text content */
  .content {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
  }
  .eyebrow {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 7px;
    color: #E2A615;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 80px;
    font-weight: 900;
    margin: 0;
    line-height: 1.0;
    letter-spacing: -0.02em;
    text-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  h1 .accent {
    color: #E2A615;
  }
  .subtitle {
    font-size: 26px;
    font-weight: 500;
    margin-top: 22px;
    line-height: 1.35;
    opacity: 0.92;
    max-width: 520px;
  }
  .duration-pill {
    margin-top: 28px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(226, 166, 21, 0.18);
    border: 1px solid rgba(226, 166, 21, 0.45);
    color: #E2A615;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  /* Footer URL */
  .footer-row {
    position: absolute;
    bottom: 36px; left: 80px; right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    font-weight: 600;
    z-index: 1;
  }
  .footer-row .brand {
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.55;
    font-size: 16px;
  }
  .footer-row .url {
    background: rgba(0,0,0,0.30);
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 18px;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div class="og">
  <div class="logo-wrap">
    <img src="https://www.challengersranking.com/newman/logo.png" alt="Newman">
  </div>
  <div class="content">
    <div class="eyebrow">RANKING NEWMAN</div>
    <h1>¿Cómo te <span class="accent">registrás?</span></h1>
    <div class="subtitle">Tour rápido por el flow de registro para sumarte a la escalera del club.</div>
    <div class="duration-pill">▶ 45 segundos</div>
  </div>
  <div class="footer-row">
    <span class="brand">Challengers Ranking</span>
    <span class="url">newman.challengersranking.com/signup</span>
  </div>
</div>
</body>
</html>
